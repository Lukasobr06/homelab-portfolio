# UniFi Network Application mit separater MongoDB
# Alle Werte sind Platzhalter.

services:
  unifi-app:
    image: lscr.io/linuxserver/unifi-network-application:<TAG>
    container_name: unifi-app
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=<ZEITZONE>
      - MONGO_HOST=unifi-db
      - MONGO_PORT=27017
      - MONGO_DBNAME=unifi
      - MONGO_USER=<BENUTZER>
      - MONGO_PASS=<PASSWORT>
    volumes:
      - ./unifi-config:/config
    ports:
      - 8443:8443        # Web-UI (HTTPS)
      - 8080:8080        # Device-Inform
      - 3478:3478/udp    # STUN
      - 10001:10001/udp  # AP-Discovery
    networks:
      - backend
    depends_on:
      - unifi-db
    restart: unless-stopped

  unifi-db:
    image: mongo:<TAG>
    container_name: unifi-db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=<ADMIN-BENUTZER>
      - MONGO_INITDB_ROOT_PASSWORD=<PASSWORT>
    volumes:
      - ./mongo-data:/data/db
    # Kein ports-Eintrag: Datenbank nur im internen Docker-Netz erreichbar
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:
